services:
  - type: web
    name: privacyguard-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: APP_SECRET_KEY
        generateValue: true
    healthCheckPath: /api/health
